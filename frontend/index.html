<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;margin:0;color:#222}video{width:100%;max-height:320px;background:#111;border-radius:10px;object-fit:contain}button{padding:11px 17px;border:0;border-radius:8px;background:#1677ff;color:white;font-size:16px;margin:8px 8px 8px 0}button.stop{background:#555}#status{font-size:13px;margin:6px 0}</style></head><body><video id="video" autoplay playsinline muted></video><div><button id="start">카메라 시작</button><button id="stop" class="stop">중지</button></div><div id="status">카메라 시작을 눌러주세요.</div><canvas id="canvas" style="display:none"></canvas><script>
const video=document.getElementById('video'),canvas=document.getElementById('canvas'),status=document.getElementById('status');let stream=null,timer=null,seq=0,busy=false;
function msg(type,data){window.parent.postMessage(Object.assign({isStreamlitMessage:true,type},data||{}),'*')}
function height(){msg('streamlit:setFrameHeight',{height:document.body.scrollHeight+12})}
function stop(){if(timer)clearInterval(timer);timer=null;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;status.textContent='카메라 중지';height()}
async function start(){try{stop();if(!navigator.mediaDevices?.getUserMedia)throw Error('HTTPS 환경 또는 카메라 지원 브라우저가 필요합니다.');stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});video.srcObject=stream;await video.play();status.textContent='영상 연결됨 · 약 2초마다 번호판 인식 시도';height();timer=setInterval(()=>{if(busy||!video.videoWidth)return;busy=true;try{const scale=Math.min(1,960/video.videoWidth);canvas.width=Math.round(video.videoWidth*scale);canvas.height=Math.round(video.videoHeight*scale);canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);seq++;msg('streamlit:setComponentValue',{value:{seq,frame:canvas.toDataURL('image/jpeg',0.75)}})}finally{busy=false}},2200)}catch(e){status.textContent='카메라 오류: '+e.message;height()}}
document.getElementById('start').onclick=start;document.getElementById('stop').onclick=stop;window.addEventListener('beforeunload',stop);window.addEventListener('message',e=>{if(e.data?.type==='streamlit:render')height()});msg('streamlit:componentReady',{apiVersion:1});height();
</script></body></html>
